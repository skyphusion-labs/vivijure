name: Adversarial audit

# LLM red-team advisory layer (CodeQL stays the gate).
#   pr   -> @cf/moonshotai/kimi-k2.7-code on merge-base diff
#   repo -> moonshotai/kimi-k3 full tree (workflow_dispatch only; needs CF_AIG_TOKEN)
#
# The audit scripts come from the PUBLIC repo skyphusion-labs/security-audit (MIT),
# pinned by commit SHA below. They used to be checked out of THIS private repo with
# a read-only deploy key (postern#436): on a `pull_request` trigger GitHub runs the
# copy of the workflow that lives on the PR BRANCH, so that key sat in a job any
# write-access identity could rewrite. Public scripts need no key, so the
# credential is GONE rather than better guarded. FLEET_CHEZMOI_READ_TOKEN is no
# longer consumed by this template (it is still required by the private reusable
# path and by every repo not yet re-rolled: fc#1100 sequences the retirement).
#
# DATA BOUNDARY (security-audit v0.2.0): `repo` mode ships the whole tracked tree,
# and K3 is proxied to Moonshot's own API rather than run on Workers AI, so the
# script uses K3 only when the repository is PUBLIC and otherwise runs the same
# repo-mode prompt on K2.7 on Workers AI. It resolves visibility from the Actions
# event payload and FAIL-SAFES to private, so nothing needs passing here.
#
# Org secrets: ADVERSARIAL_AUDIT_CF_API_TOKEN (K2.7 /ai/run), CF_AIG_TOKEN (K3 repo mode)
# Org vars:    CLOUDFLARE_ACCOUNT_ID, AI_GATEWAY_ID
#
# Use ADVERSARIAL_AUDIT_CF_API_TOKEN, not secrets.CLOUDFLARE_API_TOKEN: repos with a
# repo-level deploy token for wrangler shadow the org name and lack Workers AI Read.
#
# Onboarding a new public repo: docs/runbooks/adversarial-audit-rollout.md has the
# full credential + permission matrix and a one-PR checklist. Read it first.
#
# TRUST MODEL. Deliberate and load-bearing: `pull_request`, never
# pull_request_target; fork PRs skipped by the same-repo gate and secretless
# regardless; advisory only, never a required check; nothing untrusted reaches a
# run: block.
#
# Third-party actions are pinned BY COMMIT SHA, not by a mutable major tag: this
# job holds the fleet-chezmoi deploy key and two CF tokens, so an upstream tag
# repoint would reach them with no change here. The version each SHA corresponds
# to is in the comment beside it; bump both together.
#
# KNOWN RESIDUAL (postern#436 closed the worst of it, this is what is left): on
# `pull_request` GitHub still runs the copy of this file that lives on the PR
# BRANCH, so the two CF tokens above remain reachable by any write-access
# identity. They are function-scoped AI tokens, not a repo credential, so a lower
# tier than the deploy key that is now gone -- NOT a non-issue. No in-file
# mitigation fixes it (the branch owns the file); closing it needs the definition
# to stop coming from the PR branch (workflow_run).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: pr (K2.7 diff) or repo (K3 full tree)
        required: true
        type: choice
        options:
          - pr
          - repo
        default: pr

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: adversarial-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Skip Dependabot by PR AUTHOR, never by github.actor: actor is whoever
    # triggered the latest run, so one human push to a Dependabot branch used to
    # switch the full audit on for that branch (live proof in postern: branch
    # dependabot/npm_and_yarn/inbound/postcss-8.5.22 has one skipped run as
    # dependabot[bot] and one full successful audit as a human pusher). The
    # author is a property of the PR and does not flip. Dependabot-triggered
    # runs may not receive org secrets at all, so auditing them cannot work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ONE place for the pin. The rollout helper substitutes
      # ea6b68a80330385f2eecb0f4ec569040fba9c786 globally, so a single occurrence is all it needs;
      # writing it twice (checkout ref + verify expectation) meant a bump needed
      # two synchronized edits and a half-bump hard-failed the run.
      # PUBLIC IS NOT IMMUTABLE: pin the security-audit COMMIT SHA of a released
      # tag, never `main` and never the tag name.
      AUDIT_SCRIPTS_PIN: ea6b68a80330385f2eecb0f4ec569040fba9c786
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No credential: skyphusion-labs/security-audit is public, so the default
      # GITHUB_TOKEN reads it (postern#436).
      - name: Checkout audit scripts (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skyphusion-labs/security-audit
          ref: ${{ env.AUDIT_SCRIPTS_PIN }}
          path: security-audit

      # Read-back, not provenance: it confirms the tree on disk is the commit we
      # asked for, before any of that tree's code executes.
      - name: Verify audit-scripts pin
        working-directory: security-audit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$AUDIT_SCRIPTS_PIN" ]]; then
            echo "::error::audit-scripts pin mismatch: expected ${AUDIT_SCRIPTS_PIN} got ${actual}"
            exit 1
          fi
          echo "audit-scripts pin OK (${actual:0:7})"

      - name: Run adversarial audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADVERSARIAL_AUDIT_CF_API_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUDIT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr' }}
        run: |
          set -euo pipefail
          mode="${AUDIT_MODE}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID unset (org variable)"
            exit 2
          fi
          if [[ "$mode" == "pr" && -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::ADVERSARIAL_AUDIT_CF_API_TOKEN required for pr mode (Workers AI Read; do not reuse deploy token)"
            exit 2
          fi
          if [[ "$mode" == "repo" && -z "${CF_AIG_TOKEN:-}" ]]; then
            echo "::error::CF_AIG_TOKEN required for repo mode (Kimi K3 unified billing)"
            exit 2
          fi
          args=(--mode "$mode" --output json --out-file audit.json --md-file audit-report.md --fail-on none)
          node security-audit/adversarial-audit.mjs "${args[@]}"

      - name: Post PR comment (advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash security-audit/post-pr-comment.sh \
            "$PR_NUMBER" \
            audit-report.md

      # v4 runs on the deprecated Node 20 runtime; v7 is the current major (same
      # name/path inputs, so this is a runtime bump, not an API change).
      - name: Upload audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adversarial-audit
          path: |
            audit.json
            audit-report.md